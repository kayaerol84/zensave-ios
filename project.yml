# XcodeGen spec — run `xcodegen` in this folder to create ZenSave.xcodeproj.
# (brew install xcodegen). Re-run it after adding or removing files.
#
# Before running on a device, replace `com.yourcompany` below (and the App Group
# in Packages/ZenCore/Sources/ZenCore/SharedStore.swift) with your own identifiers,
# and set DEVELOPMENT_TEAM to your Apple Developer team ID.

name: ZenSave

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ZenSave:
    type: application
    platform: iOS
    sources:
      - ZenSave
      # Shared logic is compiled straight into each target (not linked as a Swift package),
      # because Xcode can't resolve local packages when the path contains "@".
      - path: Packages/ZenCore/Sources/ZenCore
      # Screen Time scheduling shared with the extension (it starts each next session window).
      - Shared
    dependencies:
      - target: ZenSaveMonitor
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.zensave
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: ZenSave/ZenSave.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.yourcompany.zensave
    info:
      path: ZenSave/Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark

  ZenSaveMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ZenSaveMonitor
      - path: Packages/ZenCore/Sources/ZenCore
      - Shared
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.zensave.monitor
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ZenSaveMonitor/ZenSaveMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.yourcompany.zensave
    info:
      path: ZenSaveMonitor/Info.plist
      properties:
        CFBundleDisplayName: ZenSaveMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension

schemes:
  ZenSave:
    build:
      targets:
        ZenSave: all
    run:
      config: Debug
    # Logic tests: `swift test` in Packages/ZenCore.
